services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - ./uploads:/data/uploads
      - ./outputs:/data/outputs
      - hf_cache:/root/.cache/huggingface   # Whisper model is downloaded once, then cached
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache:
